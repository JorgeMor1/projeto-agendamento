quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5456}/${POSTGRES_DB:app_database}
%dev.quarkus.datasource.username=${POSTGRES_USER:postgres}
%dev.quarkus.datasource.password=${POSTGRES_PASSWORD:postgres}
%dev.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.rate-limiter.buckets.login-ip-limiter.limits[0].permitted-uses=60
%dev.quarkus.rate-limiter.buckets.login-ip-limiter.limits[0].period=1M

mp.jwt.verify.issuer=quarkus-jwt-auth
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=quarkus-jwt-auth

